<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
  </head>
  <body>
    <script>
      // Зберігаємо повний оригінальний шлях (path + search + hash)
      sessionStorage.setItem('rr_redirect', location.pathname + location.search + location.hash);
      // Переходимо на корінь, щоб завантажився index.html
      location.replace('/');
    </script>
  </body>
</html>
